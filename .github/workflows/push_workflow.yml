  deploy-staging:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
#    needs: [ pint ]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deployment
        uses: appleboy/ssh-action@master
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SERVER_PASSWORD
          script: |
            cd /var/www/erms_plus_uat
            git checkout -f
            git pull origin develop
            composer install --optimize-autoloader --no-dev
            echo "$SERVER_PASSWORD" | sudo -S chgrp -R www-data storage bootstrap/cache
            echo "$SERVER_PASSWORD" | sudo -S chmod -R ug+rwx storage bootstrap/cache
            php artisan optimize
            php artisan migrate --seed --force
            echo "$SERVER_PASSWORD" | sudo -S php artisan queue:restart

  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
#    needs: [ pint ]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deployment
        uses: appleboy/ssh-action@master
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SERVER_PASSWORD
          script: |
            cd /var/www/erms_plus_live
            git checkout -f
            git pull origin main
            composer install --optimize-autoloader --no-dev
            echo "$SERVER_PASSWORD" | sudo -S chgrp -R www-data storage bootstrap/cache
            echo "$SERVER_PASSWORD" | sudo -S chmod -R ug+rwx storage bootstrap/cache
            php artisan optimize
            php artisan migrate --seed --force
            echo "$SERVER_PASSWORD" | sudo -S php artisan queue:restart
